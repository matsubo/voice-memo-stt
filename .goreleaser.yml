version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: vmt
    main: ./cmd/vmt
    binary: vmt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: vmt
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Declaring files replaces goreleaser's defaults, so the docs it would have
    # picked up on its own are repeated here next to the Raycast scripts.
    files:
      - LICENSE
      - README.md
      - src: raycast/*
      - src: alfred-workflow/*

brews:
  - name: vmt
    homepage: https://github.com/matsubo/voice-memo-stt
    description: Voice Memos transcription CLI
    license: MIT
    repository:
      owner: matsubo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The launcher integrations are useless inside the tarball: Raycast and
    # Alfred both need a directory to be pointed at, and one that survives
    # upgrades.
    extra_install: |
      pkgshare.install "raycast"
      pkgshare.install "alfred-workflow"
    caveats: |
      Launcher integrations are installed to:
        #{opt_pkgshare}/raycast
        #{opt_pkgshare}/alfred-workflow

      Raycast: Settings → Extensions → Script Commands → Add Directory, and
      pick the raycast path. Alfred: import the workflow from the
      alfred-workflow path. Both are stable symlinks, so they keep working
      across upgrades.

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
