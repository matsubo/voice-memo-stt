version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: vmt
    main: ./cmd/vmt
    binary: vmt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: vmt
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Declaring files replaces goreleaser's defaults, so the docs it would have
    # picked up on its own are repeated here next to the Alfred workflow.
    files:
      - LICENSE
      - README.md
      - src: alfred-workflow/*

brews:
  - name: vmt
    homepage: https://github.com/matsubo/voice-memo-stt
    description: Voice Memos transcription CLI
    license: MIT
    repository:
      owner: matsubo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The Alfred workflow is useless inside the tarball: Alfred needs a
    # directory to import from, and one that survives upgrades.
    extra_install: |
      pkgshare.install "alfred-workflow"
    caveats: |
      The Alfred workflow is installed to:
        #{opt_pkgshare}/alfred-workflow

      It is a stable symlink, so it keeps working across upgrades.

      Raycast users: install the extension from the repository instead —
      https://github.com/matsubo/voice-memo-stt/tree/main/raycast-extension

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
